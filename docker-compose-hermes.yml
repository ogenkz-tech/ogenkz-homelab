version: "3.8"

services:
  # ----------------------------------------------------
  # INFRASTRUCTURE & MANAGEMENT
  # ----------------------------------------------------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data

  cli-proxy-api:
    image: cli-proxy-api-cli-proxy-api
    container_name: cli-proxy-api-hermes
    restart: unless-stopped
    ports:
      - "8317:8317"
      - "51121:51121"

  # ----------------------------------------------------
  # SEAFILE STACK (Cloud Storage)
  # ----------------------------------------------------
  seafile-db:
    image: mariadb:10.11
    container_name: seafile-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=db_dev_password
    volumes:
      - ./seafile-mysql/db:/var/lib/mysql

  seafile-memcached:
    image: memcached:1.6
    container_name: seafile-memcached
    restart: unless-stopped

  seafile:
    image: seafileltd/seafile-mc:11.0-latest
    container_name: seafile
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./seafile-data:/shared
    depends_on:
      - seafile-db
      - seafile-memcached

  # ----------------------------------------------------
  # BUZZ PRODUCTION STACK
  # ----------------------------------------------------
  buzz-prod-redis-1:
    image: redis:7-alpine
    container_name: buzz-prod-redis-1
    restart: unless-stopped

  buzz-prod-postgres-1:
    image: postgres:17-alpine
    container_name: buzz-prod-postgres-1
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=buzz_db_password
    volumes:
      - ./buzz-postgres:/var/lib/postgresql/data

  buzz-prod-minio-1:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: buzz-prod-minio-1
    restart: unless-stopped
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - ./buzz-minio:/data

  buzz-prod-relay-1:
    image: ghcr.io/block/buzz:main
    container_name: buzz-prod-relay-1
    restart: unless-stopped
    ports:
      - "3030:3000"
    depends_on:
      - buzz-prod-redis-1
      - buzz-prod-postgres-1
      - buzz-prod-minio-1

  # ----------------------------------------------------
  # AI MENTOR & SKILLOPT PROXY
  # ----------------------------------------------------
  skillopt-proxy:
    image: alpine/socat
    container_name: skillopt-proxy
    restart: unless-stopped
    ports:
      - "7861:7860"

  mentor-rasya:
    image: ai-mentor-rasya-mentor-rasya
    container_name: mentor-rasya
    restart: unless-stopped
